name: Banco de dados

on:
  pull_request:
    paths: ["supabase/**"]
  push:
    branches: [main]
    paths: ["supabase/**"]

permissions:
  contents: read

jobs:
  pgtap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # Sobe o Postgres local, aplica todas as migrações em ordem e roda supabase/tests/database/*.sql (pgTAP).
      - run: supabase start
      - run: supabase test db
